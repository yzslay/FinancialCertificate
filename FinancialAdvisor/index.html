<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>理財規劃人員｜歷屆考題詳解</title>
<style>
  :root {
    --text: #1a1a1a;
    --muted: #555;
    --accent: #0b3d91;
    --accent-soft: #e8eef8;
    --bg: #fafafa;
    --card: #fff;
    --line: #e5e7eb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    font-size: 16px;
    line-height: 1.7;
    color: var(--text);
    background: var(--bg);
  }
  .wrap { max-width: 820px; margin: 0 auto; padding: 24px 18px 64px; }
  header.cover {
    text-align: center;
    padding: 36px 18px 24px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    margin-bottom: 24px;
  }
  header.cover .kicker {
    display: inline-block;
    font-size: 0.78rem;
    letter-spacing: 0.12em;
    color: var(--accent);
    font-weight: 700;
    margin-bottom: 10px;
  }
  header.cover h1 { font-size: 1.6rem; margin: 0 0 8px; line-height: 1.4; }
  header.cover .sub { color: var(--muted); margin: 0 0 12px; }
  .note {
    text-align: left;
    background: #f3f6fb;
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 0.92rem;
    color: var(--muted);
  }
  h2.sec {
    font-size: 1.15rem;
    color: var(--accent);
    border-bottom: 2px solid var(--accent);
    padding-bottom: 6px;
    margin: 8px 0 16px;
  }
  .exams { display: grid; gap: 12px; }
  a.exam {
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 14px;
    align-items: center;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 16px 18px;
    text-decoration: none;
    color: inherit;
    transition: border-color 0.15s, box-shadow 0.15s, transform 0.15s;
  }
  a.exam:hover {
    border-color: var(--accent);
    box-shadow: 0 4px 16px rgba(11, 61, 145, 0.08);
    transform: translateY(-1px);
  }
  a.exam:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .badge {
    width: 56px;
    height: 56px;
    border-radius: 10px;
    background: var(--accent-soft);
    color: var(--accent);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    line-height: 1.1;
    flex-shrink: 0;
  }
  .badge .n { font-size: 1.25rem; font-weight: 800; }
  .badge .u { font-size: 0.7rem; font-weight: 600; }
  .exam h3 { margin: 0 0 4px; font-size: 1.08rem; color: var(--accent); }
  .exam p { margin: 0; font-size: 0.9rem; color: var(--muted); }
  .arrow {
    color: var(--accent);
    font-size: 1.4rem;
    font-weight: 300;
    line-height: 1;
  }
  footer {
    margin-top: 40px;
    text-align: center;
    color: var(--muted);
    font-size: 0.85rem;
  }
  @media (max-width: 520px) {
    a.exam { grid-template-columns: auto 1fr; }
    .arrow { display: none; }
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --text: #e8eaed;
      --muted: #a0a4ab;
      --accent: #8ab4f8;
      --accent-soft: #1c2a44;
      --bg: #121212;
      --card: #1e1e1e;
      --line: #333;
    }
    .note { background: #243044; }
    a.exam:hover { box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35); }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="cover">
    <div class="kicker">FINANCIAL ADVISOR</div>
    <h1>理財規劃人員專業能力測驗<br>歷屆考題解答詳解</h1>
    <p class="sub">台灣金融研訓院 · 學習用詳解（非官方原文）</p>
    <div class="note">
      正解依官方答案；詳解為學習解說。<br>
      每屆編排：一、理財工具（第1–50題）→ 二、理財規劃實務（第1–50題）。
    </div>
  </header>

  <h2 class="sec">歷屆考題</h2>
  <div class="exams" id="exams"></div>

  <footer>理財規劃人員歷屆詳解 · 供個人學習使用</footer>
</div>
<script>
  /* 新增屆次：在陣列最前面加入一筆即可，檔案放在 QA/NoXX.html */
  const exams = [
    { no: 48, href: "QA/No48.html" },
    { no: 47, href: "QA/No47.html" },
    { no: 46, href: "QA/No46.html" }
  ];

  const list = document.getElementById("exams");
  exams.forEach((exam) => {
    const a = document.createElement("a");
    a.className = "exam";
    a.href = exam.href;
    a.innerHTML =
      '<div class="badge"><span class="n">' + exam.no + '</span><span class="u">屆</span></div>' +
      "<div>" +
        "<h3>第" + exam.no + "屆 理財規劃人員專業能力測驗</h3>" +
        "<p>理財工具 50 題 · 理財規劃實務 50 題 · 解答與詳解</p>" +
      "</div>" +
      '<span class="arrow" aria-hidden="true">→</span>';
    list.appendChild(a);
  });
</script>
</body>
</html>
